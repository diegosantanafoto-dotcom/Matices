name: Deploy Matices to Hostinger

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy site to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Build project
        run: npm run build

      - name: 📦 Install lftp
        run: sudo apt-get install -y lftp

      - name: 📁 Deploy via FTP to Hostinger
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          lftp -c "
            set cmd:fail-exit no;
            set ftp:ssl-allow no;
            set ssl:verify-certificate no;
            open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER;
            
            # 1. Despliegue en subdominio hallo.matices.ch (ambas rutas relativas para máxima compatibilidad)
            echo '=== Sincronizando subdominio hallo.matices.ch en ./hallomatices/ ===';
            mkdir -p ./hallomatices/;
            rm ./hallomatices/default.php;
            mirror --reverse --delete --verbose ./dist/ ./hallomatices/;

            echo '=== Sincronizando subdominio hallo.matices.ch en ./public_html/hallomatices/ ===';
            mkdir -p ./public_html/hallomatices/;
            rm ./public_html/hallomatices/default.php;
            mirror --reverse --delete --verbose ./dist/ ./public_html/hallomatices/;

            # 2. Despliegue en dominio general matices.ch (ambas rutas relativas preservando subdominios)
            echo '=== Sincronizando dominio general matices.ch en ./ ===';
            mirror --reverse --delete -X 'hallomatices*' -X '.well-known*' -X 'public_html*' --verbose ./dist/ ./;

            echo '=== Sincronizando dominio general matices.ch en ./public_html/ ===';
            mirror --reverse --delete -X 'hallomatices*' -X '.well-known*' --verbose ./dist/ ./public_html/;
            
            bye
          "
